# Drop-in override for the Ollama systemd service.
# Install to: /etc/systemd/system/ollama.service.d/override.conf
[Service]
# Keep the resident model tier loaded indefinitely instead of evicting after the
# default 5 minutes. This is the single most important Ollama tuning for V.I.V.I —
# it removes cold-load latency on the conductor/embedding models.
Environment=OLLAMA_KEEP_ALIVE=-1
# Ollama already binds 127.0.0.1:11434 by default; uncomment to be explicit.
# Environment=OLLAMA_HOST=127.0.0.1:11434
